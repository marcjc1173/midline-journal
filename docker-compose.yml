services:
  midline:
    image: ghcr.io/marcjc1173/midline-journal:latest
    container_name: midline-journal
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    environment:
      - PORT=3001
      - DATA_DIR=/data
      # Uncomment when serving over HTTPS (required for phone Passkeys outside localhost):
      # - RP_ID=journal.midlinejournal.com
      # - ORIGIN=https://journal.midlinejournal.com
      # - RP_NAME=Midline Journal
